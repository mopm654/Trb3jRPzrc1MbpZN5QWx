name: RandomX CPU Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================

      - name: Collect system information
        shell: bash
        run: |
          set -u

          mkdir -p reports/benchmarks

          {
            echo "===== DATE ====="
            date -Is

            echo
            echo "===== OS ====="
            cat /etc/os-release

            echo
            echo "===== KERNEL ====="
            uname -a

            echo
            echo "===== CPU ====="
            lscpu

            echo
            echo "===== CPU COUNT ====="
            nproc

            echo
            echo "===== MEMORY ====="
            free -h

            echo
            echo "===== CPU TOPOLOGY ====="
            lscpu -e

            echo
            echo "===== CACHE ====="
            lscpu -C || true

            echo
            echo "===== VIRTUALIZATION ====="
            systemd-detect-virt || true

            echo
            echo "===== CPU FLAGS ====="
            lscpu | grep -i flags || true

          } | tee reports/system-info.txt


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            libuv1-dev \
            libssl-dev \
            libhwloc-dev \
            hwloc


      # ============================================================
      # HWLOC
      # ============================================================

      - name: Check CPU topology
        shell: bash
        run: |
          {
            echo "===== HWLOC VERSION ====="
            hwloc-info --version || true

            echo
            echo "===== CPU TOPOLOGY ====="
            lstopo-no-graphics || true

          } | tee reports/hwloc.txt


      # ============================================================
      # DOWNLOAD XMRIG
      # ============================================================

      - name: Download XMRig
        shell: bash
        run: |
          git clone --depth 1 \
            https://github.com/xmrig/xmrig.git


      # ============================================================
      # BUILD XMRIG
      # ============================================================

      - name: Build XMRig
        shell: bash
        run: |
          cmake \
            -S xmrig \
            -B xmrig/build \
            -DWITH_HWLOC=ON \
            -DWITH_TLS=ON

          cmake \
            --build xmrig/build \
            --parallel "$(nproc)"

          echo
          echo "===== XMRIG VERSION ====="

          ./xmrig/build/xmrig --version


      # ============================================================
      # CREATE EXPLICIT XMRIG CONFIG
      # ============================================================

      - name: Create XMRig benchmark config
        shell: bash
        run: |
          cat > xmrig/build/benchmark-config.json <<'EOF'
          {
            "autosave": false,
            "background": false,
            "colors": false,
            "title": false,

            "randomx": {
              "init": -1,
              "init-avx2": 0,
              "mode": "auto",
              "1gb-pages": false,
              "rdmsr": true,
              "wrmsr": false,
              "cache_qos": false,
              "numa": true,
              "scratchpad_prefetch_mode": 1
            },

            "cpu": {
              "enabled": true,
              "huge-pages": true,
              "huge-pages-jit": false,
              "hw-aes": null,
              "priority": null,
              "memory-pool": true,
              "yield": true,
              "max-threads-hint": 100,
              "asm": true,
              "argon2-impl": null
            },

            "donate-level": 0,

            "pools": [],

            "print-time": 60,
            "health-print-time": 60,

            "dmi": true,

            "retries": 1,
            "retry-pause": 1,

            "syslog": false,

            "tls": {
              "enabled": false
            },

            "dns": {
              "ip_version": 0,
              "ttl": 30
            },

            "verbose": 0,
            "watch": false
          }
          EOF

          echo
          echo "===== BENCHMARK CONFIG ====="
          cat xmrig/build/benchmark-config.json


      # ============================================================
      # VERIFY CONFIG
      # ============================================================

      - name: Verify XMRig configuration
        shell: bash
        run: |
          ./xmrig/build/xmrig \
            --config=xmrig/build/benchmark-config.json \
            --dry-run \
            --no-color


      # ============================================================
      # RANDOMX 1-4 THREAD BENCHMARK
      # ============================================================

      - name: RandomX thread scaling benchmark
        shell: bash
        run: |

          MAX_THREADS="$(nproc)"

          if [ "$MAX_THREADS" -gt 4 ]; then
            MAX_THREADS=4
          fi

          echo "Detected CPUs: $(nproc)"
          echo "Testing 1-$MAX_THREADS threads"

          for threads in $(seq 1 "$MAX_THREADS"); do

            echo
            echo "=============================================="
            echo "RANDOMX - ${threads} THREAD(S)"
            echo "=============================================="

            ./xmrig/build/xmrig \
              --config=xmrig/build/benchmark-config.json \
              --bench=10M \
              --algo=rx/0 \
              --threads="$threads" \
              --no-huge-pages \
              --no-color \
              2>&1 | tee \
              "reports/benchmarks/randomx-${threads}threads.txt"

          done


      # ============================================================
      # REPEAT 4 THREAD BENCHMARK
      # ============================================================

      - name: RandomX stability benchmark
        shell: bash
        run: |

          THREADS="$(nproc)"

          if [ "$THREADS" -gt 4 ]; then
            THREADS=4
          fi

          OUTPUT="reports/benchmarks/randomx-stability.txt"

          echo "RandomX 10M stability benchmark" | tee "$OUTPUT"
          echo "Threads: $THREADS" | tee -a "$OUTPUT"
          echo "Date: $(date -Is)" | tee -a "$OUTPUT"

          for run in 1 2 3 4 5; do

            echo | tee -a "$OUTPUT"

            echo "==============================================" \
              | tee -a "$OUTPUT"

            echo "RUN $run / 5" \
              | tee -a "$OUTPUT"

            echo "==============================================" \
              | tee -a "$OUTPUT"

            ./xmrig/build/xmrig \
              --config=xmrig/build/benchmark-config.json \
              --bench=10M \
              --algo=rx/0 \
              --threads="$THREADS" \
              --no-huge-pages \
              --no-color \
              2>&1 | tee -a "$OUTPUT"

            sleep 3

          done


      # ============================================================
      # HUGE PAGES TEST
      # ============================================================

      - name: Huge Pages benchmark
        shell: bash
        run: |

          THREADS="$(nproc)"

          if [ "$THREADS" -gt 4 ]; then
            THREADS=4
          fi

          OUTPUT="reports/benchmarks/huge-pages.txt"

          echo "===== WITHOUT HUGE PAGES =====" \
            | tee "$OUTPUT"

          ./xmrig/build/xmrig \
            --config=xmrig/build/benchmark-config.json \
            --bench=10M \
            --algo=rx/0 \
            --threads="$THREADS" \
            --no-huge-pages \
            --no-color \
            2>&1 | tee -a "$OUTPUT"

          echo | tee -a "$OUTPUT"

          echo "===== WITH HUGE PAGES =====" \
            | tee -a "$OUTPUT"

          ./xmrig/build/xmrig \
            --config=xmrig/build/benchmark-config.json \
            --bench=10M \
            --algo=rx/0 \
            --threads="$THREADS" \
            --no-color \
            2>&1 | tee -a "$OUTPUT"


      # ============================================================
      # UPLOAD RESULTS
      # ============================================================

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: randomx-benchmark-results
          path: reports/
          retention-days: 7
