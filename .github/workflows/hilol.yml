name: RandomX CPU Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================

      - name: Collect system information
        shell: bash
        run: |
          set -u

          mkdir -p reports/benchmarks

          {
            echo "===== DATE ====="
            date -Is

            echo
            echo "===== OS ====="
            cat /etc/os-release

            echo
            echo "===== KERNEL ====="
            uname -a

            echo
            echo "===== CPU ====="
            lscpu

            echo
            echo "===== CPU COUNT ====="
            nproc

            echo
            echo "===== MEMORY ====="
            free -h

            echo
            echo "===== CPU TOPOLOGY ====="
            lscpu -e

            echo
            echo "===== CACHE ====="
            lscpu -C || true

            echo
            echo "===== VIRTUALIZATION ====="
            systemd-detect-virt || true

            echo
            echo "===== CPU FLAGS ====="
            lscpu | grep -i flags || true

          } | tee reports/system-info.txt


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            libuv1-dev \
            libssl-dev \
            libhwloc-dev \
            hwloc


      # ============================================================
      # HWLOC
      # ============================================================

      - name: Check CPU topology
        shell: bash
        run: |
          {
            echo "===== HWLOC VERSION ====="
            hwloc-info --version || true

            echo
            echo "===== CPU TOPOLOGY ====="
            lstopo-no-graphics || true

          } | tee reports/hwloc.txt


      # ============================================================
      # DOWNLOAD XMRIG
      # ============================================================

      - name: Download XMRig
        shell: bash
        run: |
          git clone --depth 1 \
            https://github.com/xmrig/xmrig.git


      # ============================================================
      # BUILD XMRIG
      # ============================================================

      - name: Build XMRig
        shell: bash
        run: |
          cmake \
            -S xmrig \
            -B xmrig/build \
            -DWITH_HWLOC=ON \
            -DWITH_TLS=ON

          cmake \
            --build xmrig/build \
            --parallel "$(nproc)"

          echo
          echo "===== XMRIG VERSION ====="

          ./xmrig/build/xmrig --version


      # ============================================================
      # VERIFY BENCHMARK MODE
      # ============================================================

      - name: Test XMRig benchmark mode
        shell: bash
        run: |
          cd xmrig/build

          ./xmrig \
            --bench=1M \
            --algo=rx/0 \
            --no-huge-pages \
            --no-color


      # ============================================================
      # RANDOMX 1-4 THREAD BENCHMARK
      # ============================================================

      - name: RandomX thread scaling benchmark
        shell: bash
        run: |

          MAX_THREADS="$(nproc)"

          if [ "$MAX_THREADS" -gt 4 ]; then
            MAX_THREADS=4
          fi

          echo "Detected CPUs: $(nproc)"
          echo "Testing: 1-${MAX_THREADS} threads"

          for threads in $(seq 1 "$MAX_THREADS"); do

            echo
            echo "=============================================="
            echo "RANDOMX - ${threads} THREAD(S)"
            echo "=============================================="

            ./xmrig/build/xmrig \
              --bench=10M \
              --algo=rx/0 \
              --threads="$threads" \
              --no-huge-pages \
              --no-color \
              2>&1 | tee \
              "reports/benchmarks/randomx-${threads}threads.txt"

          done


      # ============================================================
      # 4 THREAD STABILITY TEST
      # ============================================================

      - name: RandomX stability benchmark
        shell: bash
        run: |

          THREADS="$(nproc)"

          if [ "$THREADS" -gt 4 ]; then
            THREADS=4
          fi

          OUTPUT="reports/benchmarks/randomx-stability.txt"

          echo "RandomX 10M stability benchmark" | tee "$OUTPUT"
          echo "Threads: $THREADS" | tee -a "$OUTPUT"
          echo "Date: $(date -Is)" | tee -a "$OUTPUT"

          for run in 1 2 3 4 5; do

            echo | tee -a "$OUTPUT"

            echo "==============================================" \
              | tee -a "$OUTPUT"

            echo "RUN $run / 5" \
              | tee -a "$OUTPUT"

            echo "==============================================" \
              | tee -a "$OUTPUT"

            ./xmrig/build/xmrig \
              --bench=10M \
              --algo=rx/0 \
              --threads="$THREADS" \
              --no-huge-pages \
              --no-color \
              2>&1 | tee -a "$OUTPUT"

            sleep 3

          done


      # ============================================================
      # HUGE PAGES TEST
      # ============================================================

      - name: Huge Pages benchmark
        shell: bash
        run: |

          THREADS="$(nproc)"

          if [ "$THREADS" -gt 4 ]; then
            THREADS=4
          fi

          OUTPUT="reports/benchmarks/huge-pages.txt"

          echo "===== WITHOUT HUGE PAGES =====" \
            | tee "$OUTPUT"

          ./xmrig/build/xmrig \
            --bench=10M \
            --algo=rx/0 \
            --threads="$THREADS" \
            --no-huge-pages \
            --no-color \
            2>&1 | tee -a "$OUTPUT"

          echo | tee -a "$OUTPUT"

          echo "===== WITH HUGE PAGES =====" \
            | tee -a "$OUTPUT"

          ./xmrig/build/xmrig \
            --bench=10M \
            --algo=rx/0 \
            --threads="$THREADS" \
            --no-color \
            2>&1 | tee -a "$OUTPUT"


      # ============================================================
      # UPLOAD RESULTS
      # ============================================================

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: randomx-benchmark-results
          path: reports/
          retention-days: 7
