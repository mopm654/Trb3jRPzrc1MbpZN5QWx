name: RandomX CPU Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04

    timeout-minutes: 15

    steps:
      - name: Collect system information
        shell: bash
        run: |
          set -u

          mkdir -p reports

          {
            echo "===== DATE ====="
            date -Is

            echo
            echo "===== OS ====="
            cat /etc/os-release

            echo
            echo "===== KERNEL ====="
            uname -a

            echo
            echo "===== CPU ====="
            lscpu

            echo
            echo "===== CPU COUNT ====="
            nproc

            echo
            echo "===== MEMORY ====="
            free -h

            echo
            echo "===== CPU TOPOLOGY ====="
            lscpu -e

            echo
            echo "===== CACHE ====="
            lscpu -C || true

            echo
            echo "===== CPU FLAGS ====="
            lscpu | grep -i flags || true

            echo
            echo "===== VIRTUALIZATION ====="
            systemd-detect-virt || true

          } | tee reports/system-info.txt

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            libuv1-dev \
            libssl-dev \
            hwloc

      - name: Build XMRig
        shell: bash
        run: |
          git clone --depth 1 https://github.com/xmrig/xmrig.git

          cmake -S xmrig -B xmrig/build \
            -DWITH_HWLOC=ON \
            -DWITH_TLS=ON

          cmake --build xmrig/build \
            --parallel "$(nproc)"

          ./xmrig/build/xmrig --version

      - name: RandomX benchmark - 1 to 4 threads
        shell: bash
        run: |
          set -u

          mkdir -p reports/benchmarks

          MAX_THREADS="$(nproc)"

          if [ "$MAX_THREADS" -gt 4 ]; then
            MAX_THREADS=4
          fi

          echo "Detected CPUs: $(nproc)"
          echo "Testing up to $MAX_THREADS threads"

          for threads in $(seq 1 "$MAX_THREADS"); do

            echo
            echo "=============================================="
            echo "RANDOMX BENCHMARK - ${threads} THREAD(S)"
            echo "=============================================="

            ./xmrig/build/xmrig \
              --bench=30s \
              --threads="$threads" \
              --no-huge-pages \
              --print-time=10 \
              2>&1 | tee \
              "reports/benchmarks/randomx-${threads}threads.txt"

          done

      - name: RandomX stability test - 5 runs
        shell: bash
        run: |
          set -u

          THREADS="$(nproc)"

          if [ "$THREADS" -gt 4 ]; then
            THREADS=4
          fi

          OUTPUT="reports/benchmarks/randomx-stability-5-runs.txt"

          echo "RandomX stability test" | tee "$OUTPUT"
          echo "Threads: $THREADS" | tee -a "$OUTPUT"
          echo "Date: $(date -Is)" | tee -a "$OUTPUT"

          for run in 1 2 3 4 5; do

            echo | tee -a "$OUTPUT"
            echo "==============================================" | tee -a "$OUTPUT"
            echo "RUN $run / 5" | tee -a "$OUTPUT"
            echo "==============================================" | tee -a "$OUTPUT"

            ./xmrig/build/xmrig \
              --bench=30s \
              --threads="$THREADS" \
              --no-huge-pages \
              --print-time=10 \
              2>&1 | tee -a "$OUTPUT"

            sleep 3
          done

      - name: Huge Pages comparison
        shell: bash
        run: |
          set -u

          THREADS="$(nproc)"

          if [ "$THREADS" -gt 4 ]; then
            THREADS=4
          fi

          {
            echo "===== WITHOUT HUGE PAGES ====="

            ./xmrig/build/xmrig \
              --bench=30s \
              --threads="$THREADS" \
              --no-huge-pages \
              --print-time=10

            echo
            echo "===== WITH HUGE PAGES ====="

            ./xmrig/build/xmrig \
              --bench=30s \
              --threads="$THREADS" \
              --print-time=10

          } 2>&1 | tee reports/benchmarks/huge-pages-comparison.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: randomx-benchmark-results
          path: reports/
          retention-days: 7
