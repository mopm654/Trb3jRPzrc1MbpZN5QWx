name: RandomX CPU Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04

    timeout-minutes: 20

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================

      - name: Collect system information
        shell: bash
        run: |
          set -u

          mkdir -p reports

          {
            echo "===== DATE ====="
            date -Is

            echo
            echo "===== OS ====="
            cat /etc/os-release

            echo
            echo "===== KERNEL ====="
            uname -a

            echo
            echo "===== CPU ====="
            lscpu

            echo
            echo "===== CPU COUNT ====="
            nproc

            echo
            echo "===== MEMORY ====="
            free -h

            echo
            echo "===== CPU TOPOLOGY ====="
            lscpu -e

            echo
            echo "===== CACHE ====="
            lscpu -C || true

            echo
            echo "===== VIRTUALIZATION ====="
            systemd-detect-virt || true

            echo
            echo "===== CPU FLAGS ====="
            lscpu | grep -i "flags" || true

          } | tee reports/system-info.txt


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            libuv1-dev \
            libssl-dev \
            libhwloc-dev \
            hwloc


      # ============================================================
      # 3. HWLOC / CPU TOPOLOGY
      # ============================================================

      - name: Check CPU topology
        shell: bash
        run: |
          {
            echo "===== HWLOC VERSION ====="
            hwloc-info --version || true

            echo
            echo "===== CPU TOPOLOGY ====="
            lstopo-no-graphics || true

          } | tee reports/hwloc.txt


      # ============================================================
      # 4. DOWNLOAD XMRIG
      # ============================================================

      - name: Download XMRig
        shell: bash
        run: |
          git clone --depth 1 \
            https://github.com/xmrig/xmrig.git


      # ============================================================
      # 5. BUILD XMRIG
      # ============================================================

      - name: Build XMRig
        shell: bash
        run: |

          cmake \
            -S xmrig \
            -B xmrig/build \
            -DWITH_HWLOC=ON \
            -DWITH_TLS=ON

          cmake \
            --build xmrig/build \
            --parallel "$(nproc)"

          echo
          echo "===== XMRIG VERSION ====="

          ./xmrig/build/xmrig --version


      # ============================================================
      # 6. SAVE XMRIG HELP
      # ============================================================

      - name: Save XMRig help
        shell: bash
        run: |
          ./xmrig/build/xmrig --help \
            2>&1 | tee reports/xmrig-help.txt || true


      # ============================================================
      # 7. CREATE BENCHMARK CONFIG
      # ============================================================

      - name: Create benchmark configuration
        shell: bash
        run: |

          cat > xmrig/build/config.json <<'EOF'
          {
            "autosave": false,
            "background": false,
            "colors": false,
            "donate-level": 0,
            "print-time": 10,
            "retries": 1,
            "retry-pause": 1,
            "syslog": false,
            "watch": false,

            "cpu": {
              "enabled": true,
              "huge-pages": false,
              "hw-aes": true,
              "priority": 0,
              "yield": true
            },

            "pools": []
          }
          EOF

          echo "===== BENCHMARK CONFIG ====="
          cat xmrig/build/config.json


      # ============================================================
      # 8. RANDOMX THREAD SCALING
      # ============================================================

      - name: RandomX thread scaling benchmark
        shell: bash
        run: |

          mkdir -p reports/benchmarks

          MAX_THREADS="$(nproc)"

          # Your current GitHub runner reports 4 CPUs.
          # Limit the scaling test to 4 threads.
          if [ "$MAX_THREADS" -gt 4 ]; then
            MAX_THREADS=4
          fi

          echo "Detected CPUs: $(nproc)"
          echo "Testing 1-$MAX_THREADS threads"

          for threads in $(seq 1 "$MAX_THREADS"); do

            echo
            echo "=============================================="
            echo "RANDOMX - ${threads} THREAD(S)"
            echo "=============================================="

            ./xmrig/build/xmrig \
              --config=xmrig/build/config.json \
              --bench=30s \
              --threads="$threads" \
              --no-huge-pages \
              --print-time=10 \
              2>&1 | tee \
              "reports/benchmarks/randomx-${threads}threads.txt"

          done


      # ============================================================
      # 9. STABILITY TEST
      # ============================================================

      - name: RandomX stability benchmark
        shell: bash
        run: |

          THREADS="$(nproc)"

          if [ "$THREADS" -gt 4 ]; then
            THREADS=4
          fi

          OUTPUT="reports/benchmarks/randomx-stability.txt"

          echo "RandomX stability benchmark" | tee "$OUTPUT"
          echo "Threads: $THREADS" | tee -a "$OUTPUT"
          echo "Date: $(date -Is)" | tee -a "$OUTPUT"

          for run in 1 2 3 4 5; do

            echo | tee -a "$OUTPUT"

            echo "==============================================" \
              | tee -a "$OUTPUT"

            echo "RUN $run / 5" \
              | tee -a "$OUTPUT"

            echo "==============================================" \
              | tee -a "$OUTPUT"

            ./xmrig/build/xmrig \
              --config=xmrig/build/config.json \
              --bench=30s \
              --threads="$THREADS" \
              --no-huge-pages \
              --print-time=10 \
              2>&1 | tee -a "$OUTPUT"

            sleep 3

          done


      # ============================================================
      # 10. HUGE PAGES COMPARISON
      # ============================================================

      - name: Huge Pages comparison
        shell: bash
        run: |

          THREADS="$(nproc)"

          if [ "$THREADS" -gt 4 ]; then
            THREADS=4
          fi

          OUTPUT="reports/benchmarks/huge-pages.txt"

          echo "===== WITHOUT HUGE PAGES =====" \
            | tee "$OUTPUT"

          ./xmrig/build/xmrig \
            --config=xmrig/build/config.json \
            --bench=30s \
            --threads="$THREADS" \
            --no-huge-pages \
            --print-time=10 \
            2>&1 | tee -a "$OUTPUT"

          echo | tee -a "$OUTPUT"

          echo "===== WITH HUGE PAGES =====" \
            | tee -a "$OUTPUT"

          ./xmrig/build/xmrig \
            --config=xmrig/build/config.json \
            --bench=30s \
            --threads="$THREADS" \
            --print-time=10 \
            2>&1 | tee -a "$OUTPUT"


      # ============================================================
      # 11. UPLOAD ALL RESULTS
      # ============================================================

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: randomx-benchmark-results
          path: reports/
          retention-days: 7
